<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Frontend quiz app</title>
  </head>
  <body>
    <!-- Quiz menu start -->
    <article class="main-area">
      <div class="theme-control">
        <img src="./assets/images/icon-sun-dark.svg" alt="sun switch" />
        <input type="checkbox" id="darkmode-toggle" />
        <label for="darkmode-toggle" class="toggle"></label>
        <img src="./assets/images/icon-moon-dark.svg" alt="moon switch" />
      </div>
      <div class="main-menu">
        <div class="hero">
          <h1 class="title">Welcome ot the <span class="title-bold">Frontend Quiz!</span></h1>
          <p class="sub-title">Pick a subject to get started.</p>
        </div>
        <div class="menu">
          <div class="option">
            <img src="./assets/images/icon-html.svg" alt="html icon" class="option-img-html" />
            <h2 class="option__text">HTML</h2>
          </div>
          <div class="option">
            <img src="./assets/images/icon-css.svg" alt="css icon" class="option-img-css"/>
            <h2 class="option__text">CSS</h2>
          </div>
          <div class="option">
            <img src="./assets/images/icon-js.svg" alt="js icon" class="option-img-js"/>
            <h2 class="option__text">Javascript</h2>
          </div>
          <div class="option">
            <img
              src="./assets/images/icon-accessibility.svg"
              alt="Accessibility icon" class="option-img-access"
            />
            <h2 class="option__text">Accessibility</h2>
          </div>
        </div>
      </div>
    </article>

    <!-- Quiz menu end -->
  </body>
</html>
