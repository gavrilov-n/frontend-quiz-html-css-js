<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Frontend quiz app</title>
  </head>
  <body>
    <header class="header">
      <div class="topic no-visibility">
        <img src="./assets/images/icon-html.svg" alt="" class="img-icon">
        <p class="screen--menu__options__text">HTML</p>
      </div>
      <div class="theme-control">
        <img src="./assets/images/icon-sun-dark.svg" alt="" />
        <input type="checkbox" id="darkmode-toggle" />
        <label for="darkmode-toggle" class="toggle"></label>
        <img src="./assets/images/icon-moon-dark.svg" alt="" />
      </div>
    </header>
    <main>
      <section class="screen screen--menu">
        <div class="screen__inner--text">
          <h1 class="screen__inner--text__title">
            Welcome to the
            <span class="screen__innner--text__title-bold">Frontend Quiz!</span>
          </h1>
          <p class="screen__inner--text__subtitle">
            Pick a subject to get started
          </p>
        </div>
        <div class="screen--menu__options">
          <div class="option">
            <img
              src="./assets/images/icon-html.svg"
              alt=""
              class="img-icon html-icon"
            />
            <p class="screen--menu__options__text">HTML</p>
          </div>
          <div class="option">
            <img
              src="./assets/images/icon-css.svg"
              alt=""
              class="img-icon css-icon"
            />
            <p class="screen--menu__options__text">CSS</p>
          </div>
          <div class="option">
            <img
              src="./assets/images/icon-js.svg"
              alt=""
              class="img-icon js-icon"
            />
            <p class="screen--menu__options__text">Javascript</p>
          </div>
          <div class="option">
            <img src="./assets/images/icon-accessibility.svg" alt="" class="img-icon access-icon"/>
            <p class="screen--menu__options__text">Accessibility</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
